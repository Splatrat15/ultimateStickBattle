<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Stick Battle</title>
  <link rel="stylesheet" href="/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    #debugOverlay {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      font-family: monospace;
      z-index: 1000;
      font-size: 12px;
      line-height: 1.4;
      max-width: 300px;
      pointer-events: none;
      text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div id="debugOverlay">Debug Info</div>
  <div id="characterMenu">
    <h1>Ultimate Stick Battle</h1>
    <div id="characterGrid">
      <!-- Character boxes will be dynamically created here -->
    </div>
    <div class="playerChoice">
      <span id="player1Choice" class="choiceText player1Choice">Player 1 Choose</span>
      <button id="startButton" style="display: none;">Start Game</button>
      <span id="player2Choice" class="choiceText player2Choice" style="display: none;">Player 2 Choose</span>
    </div>
  </div>
  
  <canvas id="gameCanvas" style="display:none;"></canvas>
  <script>
    // Add global debug logging
    window.debugLog = function(message, data) {
      console.log(`[DEBUG] ${message}`, data);
    };
  </script>
  <script type="module" src="characterMenu.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
