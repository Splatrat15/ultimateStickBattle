<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Stick Battle</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="characterMenu">
    <h1>Ultimate Stick Battle</h1>
    <div id="characterGrid">
      <div class="characterBox" id="kaonBox">
        <p>Kaon</p>
      </div>
      <div class="characterBox" id="rakkaBox">
        <p>Rakka</p>
      </div>
      <div class="characterBox" id="vantaBox">
        <p>Vanta</p>
      </div>
      <div class="characterBox" id="glitchBox">
        <p>Glitch</p>
      </div>
      <div class="characterBox" id="emberBox">
        <p>Ember</p>
      </div>
      <div class="characterBox" id="aeonBox">
        <p>Aeon</p>
      </div>
      <div class="characterBox" id="aceBox">
        <p>Ace</p>
      </div>
      <div class="characterBox" id="onyxBox">
        <p>Onyx</p>
      </div>
      <div class="characterBox" id="randomBox">
        <span class="questionMark">?</span>
        <p>Random</p>
      </div>
    </div>
    <button id="startButton">Start Game</button>
  </div>
  
  <canvas id="gameCanvas" style="display:none;"></canvas>
  <script src="characterMenu.js"></script>
  <script src="game.js"></script>
</body>
</html>
